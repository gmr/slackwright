[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slackwright"
version = "0.1.0"
description = "Building blocks for AI agents that live in Slack"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Gavin M. Roy", email = "gavinmroy@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = ["slack", "bot", "agent", "markdown", "block-kit", "canvas"]
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "pydantic>=2.10",
    "slack-sdk>=3.47",
]

[project.urls]
Homepage = "https://github.com/gmr/slackwright"
"Bug Tracker" = "https://github.com/gmr/slackwright/issues"

[dependency-groups]
dev = [
    "basedpyright",
    "build",
    "coverage[toml]",
    "mypy",
    "pre-commit",
    "ruff",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.coverage.run]
branch = true
command_line = "-m unittest discover tests --buffer --verbose"
data_file = "build/.coverage"
source = ["slackwright"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "typing.TYPE_CHECKING",
]

[tool.coverage.html]
directory = "build/coverage"

[tool.coverage.xml]
output = "build/coverage.xml"

[tool.hatch.build.targets.wheel]
include = ["slackwright"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "BLE",      # flake8-blind-except
    "C4",       # flake8-comprehensions
    "C90",      # mccabe
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "G",        # flake8-logging-format
    "I",        # isort
    "N",        # pep8-naming
    "Q",        # flake8-quotes
    "S",        # flake8-bandit
    "ASYNC",    # flake8-async
    "B",        # flake8-bugbear
    "DTZ",      # flake8-datetimez
    "FURB",     # refurb
    "RUF",      # ruff-specific
    "T20",      # flake8-print
    "UP",       # pyupgrade
]
ignore = [
    "RSE",      # contradicts Python Style Guide
]
flake8-quotes = {inline-quotes = "single"}

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]
